<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการสต็อก & วันหมดอายุ (RTC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 text-center">
      <h1 class="text-xl font-bold"><i class="fa-solid fa-boxes-stacked mr-2"></i>ระบบสต็อก & Expiry RTC</h1>
    </div>
  </header>

  <div class="max-w-md mx-auto p-4 pb-24">

    <!-- TAB 1: เพิ่มสินค้า -->
    <section id="tab1" class="tab-content">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-lg font-semibold text-slate-700 border-b pb-2 mb-4"><i class="fa-solid fa-plus-circle text-indigo-600 mr-2"></i>1. เพิ่มสินค้าเข้าสต็อก</h2>
        
        <!-- ล็อครหัสผ่าน -->
        <div id="authBox" class="space-y-4">
          <p class="text-sm text-slate-500">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งานระบบนี้</p>
          <input type="password" id="sysPassword" placeholder="ใส่รหัสผ่าน 6 หลัก" class="w-full border rounded-xl p-3 text-center text-lg tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none">
          <button onclick="checkPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition">ยืนยันรหัสผ่าน</button>
        </div>

        <!-- ฟอร์มเพิ่มสินค้า (ซ่อนไว้ก่อน) -->
        <div id="stockForm" class="hidden space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">รหัสบาร์โค้ด</label>
            <input type="text" id="addBarcode" placeholder="เช่น 098" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">ชื่อสินค้า</label>
            <input type="text" id="addName" placeholder="เช่น ขนมปัง" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">ราคา (บาท)</label>
            <input type="number" id="addPrice" placeholder="เช่น 20" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <button onclick="saveProduct()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-md">บันทึกเข้าสต็อก</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: ทำวันหมดอายุ -->
    <section id="tab2" class="tab-content hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
        <h2 class="text-lg font-semibold text-slate-700 border-b pb-2"><i class="fa-solid fa-barcode text-indigo-600 mr-2"></i>2. บันทึกวันหมดอายุ & RTC</h2>
        
        <div>
          <label class="block text-sm font-medium mb-1">พิมพ์/สแกน บาร์โค้ด</label>
          <div class="flex gap-2">
            <input type="text" id="searchBarcode" placeholder="กรอกรหัส เช่น 098" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="fetchProduct()" class="bg-indigo-600 text-white px-4 rounded-xl font-medium hover:bg-indigo-700">ดึงข้อมูล</button>
          </div>
        </div>

        <!-- รายละเอียดสินค้าที่ดึงมา -->
        <div id="productDetail" class="hidden bg-slate-50 p-4 rounded-xl border space-y-2">
          <p class="text-sm text-slate-500">ข้อมูลสินค้า:</p>
          <p class="font-bold text-slate-800 text-lg" id="fetchedName">-</p>
          <p class="text-indigo-600 font-semibold" id="fetchedPrice">-</p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">ระบุวันหมดอายุ</label>
          <input type="date" id="expDateInput" onchange="calculateRTC()" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- แสดงการคาดการณ์ RTC -->
        <div id="rtcPreview" class="hidden p-3 rounded-xl text-center font-bold text-sm"></div>

        <button onclick="saveExpiry()" id="btnSaveExpiry" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md opacity-50 cursor-not-allowed" disabled>บันทึกวันหมดอายุ</button>
      </div>
    </section>

    <!-- TAB 3: ดูรายการทั้งหมด -->
    <section id="tab3" class="tab-content hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-lg font-semibold text-slate-700"><i class="fa-solid fa-list-check text-indigo-600 mr-2"></i>3. รายการวันหมดอายุทั้งหมด</h2>
          <button onclick="loadExpiries()" class="text-sm text-indigo-600 font-medium"><i class="fa-solid fa-rotate-right mr-1"></i>รีเฟรช</button>
        </div>

        <div id="expiryList" class="space-y-3">
          <p class="text-center text-slate-400 py-4">กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </section>

  </div>

  <!-- Bottom Navigation Menu (สำหรับมือถือ) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg">
    <div class="max-w-md mx-auto flex justify-around py-2">
      <button onclick="switchTab('tab1')" id="nav-tab1" class="flex flex-col items-center text-indigo-600 font-medium text-xs">
        <i class="fa-solid fa-box-archive text-lg mb-1"></i>
        <span>เพิ่มสินค้า</span>
      </button>
      <button onclick="switchTab('tab2')" id="nav-tab2" class="flex flex-col items-center text-slate-400 font-medium text-xs">
        <i class="fa-solid fa-calendar-plus text-lg mb-1"></i>
        <span>ทำวันหมดอายุ</span>
      </button>
      <button onclick="switchTab('tab3')" id="nav-tab3" class="flex flex-col items-center text-slate-400 font-medium text-xs">
        <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i>
        <span>รายการ RTC</span>
      </button>
    </div>
  </nav>

  <script>
    // URL สำหรับเชื่อมต่อกับ Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqQuYRlBO42DDbDaQZ9ki-HDesid9NCHI7hpa1oXFKzxM_TzN5vi3zsjpeBRQxNIx89g/exec";

    let currentProduct = null;

    // ระบบสลับ หน้า (Tabs)
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      ['tab1', 'tab2', 'tab3'].forEach(id => {
        const btn = document.getElementById('nav-' + id);
        if (id === tabId) {
          btn.className = "flex flex-col items-center text-indigo-600 font-medium text-xs";
        } else {
          btn.className = "flex flex-col items-center text-slate-400 font-medium text-xs";
        }
      });

      if (tabId === 'tab3') loadExpiries();
    }

    // ระบบตรวจรหัสผ่าน Tab 1
    function checkPassword() {
      const pwd = document.getElementById('sysPassword').value;
      if (pwd === '254903') {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('stockForm').classList.remove('hidden');
        Swal.fire({ icon: 'success', title: 'ปลดล็อคสำเร็จ', timer: 1000, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง', text: 'กรุณาลองใหม่อีกครั้ง' });
      }
    }

    // บันทึกสินค้าเข้าสต็อก
    async function saveProduct() {
      const barcode = document.getElementById('addBarcode').value.trim();
      const name = document.getElementById('addName').value.trim();
      const price = document.getElementById('addPrice').value;

      if (!barcode || !name || !price) {
        Swal.fire('กรอกข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลให้ครบทุกช่อง', 'warning');
        return;
      }

      Swal.showLoading();
      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addProduct', barcode, name, price })
        }).then(r => r.json());

        if (res.status === 'success') {
          Swal.fire('สำเร็จ', 'บันทึกสินค้าเรียบร้อยแล้ว', 'success');
          document.getElementById('addBarcode').value = '';
          document.getElementById('addName').value = '';
          document.getElementById('addPrice').value = '';
        }
      } catch (err) {
        Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
      }
    }

    // ดึงข้อมูลสินค้าตามบาร์โค้ด
    async function fetchProduct() {
      const barcode = document.getElementById('searchBarcode').value.trim();
      if (!barcode) return;

      Swal.showLoading();
      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getProduct', barcode })
        }).then(r => r.json());

        Swal.close();

        if (res.status === 'success') {
          currentProduct = res.data;
          document.getElementById('fetchedName').innerText = currentProduct.name;
          document.getElementById('fetchedPrice').innerText = currentProduct.price + ' บาท';
          document.getElementById('productDetail').classList.remove('hidden');
        } else {
          currentProduct = null;
          document.getElementById('productDetail').classList.add('hidden');
          Swal.fire('ไม่พบสินค้า', res.message, 'error');
        }
      } catch (err) {
        Swal.fire('ผิดพลาด', 'เกิดข้อผิดพลาดในการดึงข้อมูล', 'error');
      }
    }

    // คำนวณวันหมดอายุ & สถานะ RTC
    function calculateRTC() {
      const expDateVal = document.getElementById('expDateInput').value;
      if (!expDateVal || !currentProduct) return;

      const expDate = new Date(expDateVal);
      const today = new Date();
      today.setHours(0,0,0,0);
      expDate.setHours(0,0,0,0);

      const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
      const preview = document.getElementById('rtcPreview');
      const btn = document.getElementById('btnSaveExpiry');

      preview.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-amber-100', 'text-amber-700', 'bg-emerald-100', 'text-emerald-700');

      let status = '';
      if (diffDays <= 15) {
        status = 'ติด RTC 50%';
        preview.classList.add('bg-red-100', 'text-red-700');
      } else if (diffDays <= 30) {
        status = 'ติด RTC 30%';
        preview.classList.add('bg-amber-100', 'text-amber-700');
      } else {
        status = 'สถานะปกติ';
        preview.classList.add('bg-emerald-100', 'text-emerald-700');
      }

      preview.innerText = `เหลือเวลาอีก ${diffDays} วัน -> ${status}`;
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    // บันทึกวันหมดอายุ
    async function saveExpiry() {
      const expDate = document.getElementById('expDateInput').value;
      const rtcStatus = document.getElementById('rtcPreview').innerText.split('-> ')[1] || 'ปกติ';

      Swal.showLoading();
      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'addExpiry',
            barcode: currentProduct.barcode,
            name: currentProduct.name,
            price: currentProduct.price,
            expDate,
            rtcStatus
          })
        }).then(r => r.json());

        if (res.status === 'success') {
          Swal.fire('สำเร็จ', 'บันทึกวันหมดอายุเรียบร้อยแล้ว', 'success');
          document.getElementById('searchBarcode').value = '';
          document.getElementById('expDateInput').value = '';
          document.getElementById('productDetail').classList.add('hidden');
          document.getElementById('rtcPreview').classList.add('hidden');
        }
      } catch (err) {
        Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
      }
    }

    // ดึงข้อมูลรายการทั้งหมดมาแสดง
    async function loadExpiries() {
      const container = document.getElementById('expiryList');
      container.innerHTML = '<p class="text-center text-slate-400 py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังโหลดข้อมูล...</p>';

      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getExpiries' })
        }).then(r => r.json());

        if (res.status === 'success' && res.data.length > 0) {
          container.innerHTML = '';
          res.data.reverse().forEach(item => {
            let badgeClass = 'bg-slate-100 text-slate-600';
            if (item.daysLeft <= 15) badgeClass = 'bg-red-500 text-white';
            else if (item.daysLeft <= 30) badgeClass = 'bg-amber-500 text-white';

            container.innerHTML += `
              <div class="border rounded-xl p-3 flex justify-between items-center shadow-sm">
                <div>
                  <p class="font-bold text-slate-800">${item.name} (${item.price}฿)</p>
                  <p class="text-xs text-slate-400">รหัส: ${item.barcode} | หมดอายุ: ${item.expDate.split('T')[0]}</p>
                </div>
                <div class="text-right">
                  <span class="text-xs px-2.5 py-1 rounded-full font-bold ${badgeClass}">${item.rtcStatus}</span>
                  <p class="text-xs text-slate-500 mt-1">อีก ${item.daysLeft} วัน</p>
                </div>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p class="text-center text-slate-400 py-4">ยังไม่มีรายการบันทึกวันหมดอายุ</p>';
        }
      } catch (err) {
        container.innerHTML = '<p class="text-center text-red-400 py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
      }
    }
  </script>
</body>
</html>
