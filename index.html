<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสต็อก & วันหมดอายุสินค้า (RTC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Modal ป้องกันด้วยรหัสผ่าน 254903 -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-sm w-full text-center">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-2">เข้าสู่ระบบสต็อก</h2>
      <p class="text-sm text-slate-500 mb-6">กรุณากรอกรหัสผ่านเพื่อใช้งานระบบ</p>
      
      <input type="password" id="pinInput" placeholder="กรอกรหัสผ่าน" maxlength="6"
        class="w-full text-center text-2xl tracking-widest font-mono border-2 border-slate-200 rounded-xl py-3 mb-4 focus:outline-none focus:border-blue-500 transition">
      
      <p id="pinError" class="text-red-500 text-xs mb-4 hidden">รหัสผ่านไม่ถูกต้อง!</p>

      <button onclick="checkPin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl shadow-lg shadow-blue-500/30 transition duration-200">
        ตกลง
      </button>
    </div>
  </div>

  <!-- หน้าจอหลัก -->
  <div class="max-w-3xl mx-auto p-4 sm:p-6">
    
    <!-- ส่วนหัวข้อ -->
    <header class="bg-white rounded-2xl p-6 shadow-sm mb-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-3 rounded-xl shadow-md">
          <i class="fa-solid fa-boxes-stacked text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-800">ระบบจัดการสต็อก & วันหมดอายุ</h1>
          <p class="text-xs text-slate-500">ตรวจสอบและแจ้งเตือนติดป้าย RTC</p>
        </div>
      </div>
      <button onclick="lockSystem()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg transition">
        <i class="fa-solid fa-lock mr-1"></i> ล็อคระบบ
      </button>
    </header>

    <!-- แท็บสลับหน้า -->
    <div class="flex bg-slate-200/80 p-1 rounded-xl mb-6 gap-2">
      <button id="tab1Btn" onclick="switchTab(1)" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-blue-600 shadow-sm">
        <i class="fa-solid fa-plus-circle mr-1"></i> 1. เพิ่มสินค้าเข้าสต็อก
      </button>
      <button id="tab2Btn" onclick="switchTab(2)" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900">
        <i class="fa-solid fa-clock-rotate-left mr-1"></i> 2. เช็ควันหมดอายุ (RTC)
      </button>
    </div>

    <!-- ระบบที่ 1: เพิ่มของเข้าสต็อก -->
    <div id="tab1" class="bg-white rounded-2xl p-6 shadow-sm">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-barcode text-blue-600"></i> เพิ่มสินค้าใหม่ / อัปเดตสต็อก
      </h2>
      <form id="stockForm" onsubmit="handleSaveStock(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสบาร์โค้ด / รหัสสินค้า</label>
          <input type="text" id="addBarcode" required placeholder="เช่น 098"
            class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อสินค้า</label>
          <input type="text" id="addName" required placeholder="เช่น ขนมปัง"
            class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ราคา (บาท)</label>
          <input type="text" id="addPrice" required placeholder="เช่น 20บาท"
            class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" id="saveStockBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
          บันทึกเข้าสต็อก
        </button>
      </form>
    </div>

    <!-- ระบบที่ 2: เช็ควันหมดอายุ และคำนวณ RTC -->
    <div id="tab2" class="bg-white rounded-2xl p-6 shadow-sm hidden">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-calendar-day text-amber-500"></i> บันทึกวันหมดอายุสินค้า
      </h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">กรอก/สแกน รหัสบาร์โค้ด</label>
          <input type="text" id="searchBarcode" placeholder="พิมพ์รหัส เช่น 098" oninput="lookupProduct()"
            class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-blue-500">
        </div>

        <!-- การ์ดแสดงข้อมูลสินค้าที่ดึงมา -->
        <div id="productPreview" class="bg-blue-50 border border-blue-200 rounded-xl p-4 hidden">
          <p class="text-xs text-blue-500 font-medium">พบข้อมูลสินค้าในสต็อก:</p>
          <div class="flex justify-between items-center mt-1">
            <span id="previewName" class="text-lg font-bold text-slate-800">-</span>
            <span id="previewPrice" class="text-sm font-semibold bg-blue-200 text-blue-800 px-3 py-1 rounded-lg">-</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ระบุวันหมดอายุสินค้า</label>
          <input type="date" id="expiryDate" onchange="calculateRTC()"
            class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-blue-500">
        </div>

        <!-- ผลการแจ้งเตือน RTC -->
        <div id="rtcCard" class="border-2 border-dashed border-slate-200 rounded-xl p-4 text-center hidden">
          <p class="text-xs text-slate-500 mb-1">สถานะการแจ้งเตือน</p>
          <div id="rtcBadge" class="inline-block px-4 py-2 rounded-full font-bold text-lg my-1">
            -
          </div>
          <p id="daysLeftText" class="text-xs text-slate-500 mt-1">-</p>
        </div>

        <button onclick="handleSaveExpiry()" id="saveExpiryBtn" disabled
          class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-semibold py-3 rounded-xl shadow-md transition">
          บันทึกวันหมดอายุ
        </button>
      </div>
    </div>

  </div>

  <!-- การแจ้งเตือน Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none z-50">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg" class="text-sm">การแจ้งเตือน</span>
  </div>

  <script>
    // URL Google Apps Script ล่าสุดของคุณ
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwORB8OkIlda7BYvP-7ZgxWe07O1mcAalGx54ZzQJgkVc1o3QBPymKOTHj70fTQAVnE/exec";
    
    const CORRECT_PIN = "254903";
    let stockDatabase = {};
    let currentProduct = null;
    let currentRTC = null;
    let calculatedDaysLeft = 0;

    function checkPin() {
      const pin = document.getElementById("pinInput").value;
      if (pin === CORRECT_PIN) {
        document.getElementById("authModal").classList.add("hidden");
        document.getElementById("pinInput").value = "";
        document.getElementById("pinError").classList.add("hidden");
        loadStockData();
      } else {
        document.getElementById("pinError").classList.remove("hidden");
      }
    }

    function lockSystem() {
      document.getElementById("authModal").classList.remove("hidden");
    }

    function switchTab(tabNum) {
      const t1 = document.getElementById("tab1");
      const t2 = document.getElementById("tab2");
      const b1 = document.getElementById("tab1Btn");
      const b2 = document.getElementById("tab2Btn");

      if (tabNum === 1) {
        t1.classList.remove("hidden");
        t2.classList.add("hidden");
        b1.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-blue-600 shadow-sm";
        b2.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900";
      } else {
        t1.classList.add("hidden");
        t2.classList.remove("hidden");
        b2.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-blue-600 shadow-sm";
        b1.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900";
        loadStockData();
      }
    }

    async function loadStockData() {
      showToast("กำลังเชื่อมต่อฐานข้อมูล...", "info");
      try {
        const res = await fetch(`${GAS_API_URL}?action=getStock`);
        const json = await res.json();
        if (json.status === "success") {
          stockDatabase = json.data;
          showToast("โหลดข้อมูลสำเร็จ!");
          lookupProduct();
        }
      } catch (err) {
        showToast("ไม่สามารถดึงข้อมูลสต็อกได้", "error");
      }
    }

    async function handleSaveStock(e) {
      e.preventDefault();
      const btn = document.getElementById("saveStockBtn");
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      const barcode = document.getElementById("addBarcode").value.trim();
      const name = document.getElementById("addName").value.trim();
      const price = document.getElementById("addPrice").value.trim();

      try {
        const url = `${GAS_API_URL}?action=addStock&barcode=${encodeURIComponent(barcode)}&name=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}`;
        const res = await fetch(url);
        const json = await res.json();

        if (json.status === "success") {
          showToast("บันทึกสต็อกสำเร็จ!");
          document.getElementById("stockForm").reset();
          loadStockData();
        }
      } catch (err) {
        showToast("เกิดข้อผิดพลาดในการบันทึก", "error");
      } finally {
        btn.innerText = "บันทึกเข้าสต็อก";
        btn.disabled = false;
      }
    }

    function lookupProduct() {
      const code = document.getElementById("searchBarcode").value.trim();
      const preview = document.getElementById("productPreview");
      
      if (code && stockDatabase[code]) {
        currentProduct = stockDatabase[code];
        currentProduct.barcode = code;
        document.getElementById("previewName").innerText = currentProduct.name;
        document.getElementById("previewPrice").innerText = currentProduct.price;
        preview.classList.remove("hidden");
      } else {
        currentProduct = null;
        preview.classList.add("hidden");
      }
      calculateRTC();
    }

    function calculateRTC() {
      const expInput = document.getElementById("expiryDate").value;
      const rtcCard = document.getElementById("rtcCard");
      const rtcBadge = document.getElementById("rtcBadge");
      const daysText = document.getElementById("daysLeftText");
      const saveBtn = document.getElementById("saveExpiryBtn");

      if (!currentProduct || !expInput) {
        rtcCard.classList.add("hidden");
        saveBtn.disabled = true;
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      let expDate = new Date(expInput);
      if (expDate.getFullYear() > 2500) {
        expDate.setFullYear(expDate.getFullYear() - 543);
      }
      expDate.setHours(0,0,0,0);

      const diffTime = expDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      calculatedDaysLeft = diffDays;

      rtcCard.classList.remove("hidden");

      if (diffDays <= 0) {
        currentRTC = "สินค้าหมดอายุ";
        rtcBadge.className = "inline-block px-4 py-2 rounded-full font-bold text-lg bg-red-100 text-red-700 border border-red-300";
        rtcBadge.innerText = "🛑 หมดอายุแล้ว";
      } else if (diffDays <= 15) {
        currentRTC = "ติด RTC 50%";
        rtcBadge.className = "inline-block px-4 py-2 rounded-full font-bold text-lg bg-orange-100 text-orange-700 border border-orange-300";
        rtcBadge.innerText = "🏷️ แจ้งเตือน: ติดป้าย RTC 50%";
      } else if (diffDays <= 30) {
        currentRTC = "ติด RTC 30%";
        rtcBadge.className = "inline-block px-4 py-2 rounded-full font-bold text-lg bg-amber-100 text-amber-700 border border-amber-300";
        rtcBadge.innerText = "🏷️ แจ้งเตือน: ติดป้าย RTC 30%";
      } else {
        currentRTC = "ปกติ";
        rtcBadge.className = "inline-block px-4 py-2 rounded-full font-bold text-lg bg-emerald-100 text-emerald-700 border border-emerald-300";
        rtcBadge.innerText = "✅ สถานะปกติ (ยังไม่ถึงช่วง RTC)";
      }

      daysText.innerText = `เหลือเวลาอีก ${diffDays} วัน จะถึงวันหมดอายุ`;
      saveBtn.disabled = false;
    }

    async function handleSaveExpiry() {
      const btn = document.getElementById("saveExpiryBtn");
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      const expInput = document.getElementById("expiryDate").value;

      try {
        const url = `${GAS_API_URL}?action=addExpiry` +
          `&barcode=${encodeURIComponent(currentProduct.barcode)}` +
          `&name=${encodeURIComponent(currentProduct.name)}` +
          `&price=${encodeURIComponent(currentProduct.price)}` +
          `&expiryDate=${encodeURIComponent(expInput)}` +
          `&rtcStatus=${encodeURIComponent(currentRTC)}` +
          `&daysLeft=${calculatedDaysLeft}`;

        const res = await fetch(url);
        const json = await res.json();

        if (json.status === "success") {
          showToast("บันทึกวันหมดอายุเรียบร้อย!");
          document.getElementById("searchBarcode").value = "";
          document.getElementById("expiryDate").value = "";
          document.getElementById("productPreview").classList.add("hidden");
          document.getElementById("rtcCard").classList.add("hidden");
        }
      } catch (err) {
        showToast("เกิดข้อผิดพลาดในการบันทึก", "error");
      } finally {
        btn.innerText = "บันทึกวันหมดอายุ";
        btn.disabled = false;
      }
    }

    function showToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const toastIcon = document.getElementById("toastIcon");

      toastMsg.innerText = msg;
      if (type === "error") {
        toastIcon.className = "fa-solid fa-circle-xmark text-red-400";
      } else if (type === "info") {
        toastIcon.className = "fa-solid fa-circle-info text-blue-400";
      } else {
        toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
      }

      toast.classList.remove("opacity-0", "pointer-events-none");
      setTimeout(() => {
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 3000);
    }
  </script>
</body>
</html>
