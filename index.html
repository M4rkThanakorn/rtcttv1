<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTC & Inventory Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <div class="max-w-4xl mx-auto w-full p-4 md:p-6 pb-24">
    
    <header class="flex justify-between items-center mb-6 bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50 backdrop-blur">
      <div>
        <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          <i class="fa-solid fa-boxes-packing mr-2 text-indigo-400"></i>RTC & Stock Hub
        </h1>
        <p class="text-xs text-slate-400">ระบบจัดการสต็อกและคำนวณส่วนลดตามวันหมดอายุ</p>
      </div>
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>ออนไลน์
        </span>
      </div>
    </header>

    <section id="tab-add-stock" class="tab-content hidden space-y-4">
      <div id="authOverlay" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center max-w-md mx-auto my-8 shadow-2xl">
        <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-lg font-bold mb-2">ยืนยันตัวตนก่อนเข้าใช้งาน</h2>
        <p class="text-xs text-slate-400 mb-4">เฉพาะระบบเพิ่มสินค้าเข้าสต็อกที่ต้องใช้ PIN</p>
        <input type="password" id="pinInput" placeholder="กรอก PIN 6 หลัก" maxlength="6" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-center text-xl font-mono text-white mb-4 tracking-widest focus:outline-none focus:border-indigo-500">
        <button onclick="verifyPin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition">เข้าสู่ระบบ</button>
      </div>

      <div id="addStockForm" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
          <h2 class="font-bold text-lg text-indigo-400"><i class="fa-solid fa-plus-circle mr-2"></i>เพิ่มสินค้าใหม่เข้าสต็อก</h2>
          <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full"><i class="fa-solid fa-check-circle mr-1"></i>ปลดล็อกแล้ว</span>
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">รหัสบาร์โค้ดสินค้า (รองรับ 0 นำหน้า)</label>
          <input type="text" id="stockBarcode" placeholder="เช่น 098" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">ชื่อสินค้า</label>
          <input type="text" id="stockName" placeholder="เช่น ขนมปัง" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">ราคา/รายละเอียด</label>
          <input type="text" id="stockPrice" placeholder="เช่น 20บาท" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button onclick="saveStock()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-save mr-2"></i>บันทึกข้อมูลเข้าสต็อก
        </button>
      </div>
    </section>

    <section id="tab-add-exp" class="tab-content hidden space-y-4">
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="font-bold text-lg text-cyan-400 border-b border-slate-700 pb-3">
          <i class="fa-solid fa-calendar-plus mr-2"></i>ตั้งค่าวันหมดอายุ & RTC
        </h2>
        
        <div>
          <label class="text-xs text-slate-400 mb-1 block">สแกน/พิมพ์ รหัสบาร์โค้ด</label>
          <div class="flex gap-2">
            <input type="text" id="expBarcode" placeholder="เช่น 098" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono focus:outline-none focus:border-cyan-500">
            <button onclick="fetchProductInfo()" class="px-5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition whitespace-nowrap">
              <i class="fa-solid fa-search mr-1"></i>ดึงข้อมูล
            </button>
          </div>
        </div>

        <div id="productPreview" class="hidden p-4 bg-slate-900/80 rounded-xl border border-cyan-500/30 space-y-1">
          <div class="text-xs text-cyan-400 font-semibold">พบข้อมูลสินค้า:</div>
          <div id="previewName" class="text-lg font-bold text-white"></div>
          <div id="previewPrice" class="text-sm text-slate-400"></div>
        </div>

        <div>
          <label class="text-xs text-slate-400 mb-1 block">วันหมดอายุของสินค้า (EXP Date)</label>
          <input type="date" id="expDateInput" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <button onclick="saveExpiry()" class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition shadow-lg shadow-cyan-600/30">
          <i class="fa-solid fa-clock-history mr-2"></i>บันทึกวันหมดอายุ
        </button>
      </div>
    </section>

    <section id="tab-view-exp" class="tab-content space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-lg text-slate-200"><i class="fa-solid fa-list-check mr-2 text-amber-400"></i>รายการสินค้า RTC และวันหมดอายุ</h2>
        <button onclick="loadExpiryItems()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition">
          <i class="fa-solid fa-rotate mr-1"></i>รีเฟรช
        </button>
      </div>

      <div id="expiryList" class="space-y-3">
        <div class="text-center py-12 text-slate-500">กำลังโหลดข้อมูล...</div>
      </div>
    </section>

  </div>

  <nav class="fixed bottom-0 inset-x-0 bg-slate-800/90 backdrop-blur-lg border-t border-slate-700/80 z-40">
    <div class="max-w-md mx-auto flex justify-around p-2">
      <button onclick="switchTab('tab-view-exp')" id="nav-tab-view-exp" class="nav-btn flex-1 py-2 flex flex-col items-center text-xs text-indigo-400 font-semibold">
        <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
        <span>ดู RTC ทั้งหมด</span>
      </button>
      <button onclick="switchTab('tab-add-exp')" id="nav-tab-add-exp" class="nav-btn flex-1 py-2 flex flex-col items-center text-xs text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-barcode text-lg mb-0.5"></i>
        <span>ทำวันหมดอายุ</span>
      </button>
      <button onclick="switchTab('tab-add-stock')" id="nav-tab-add-stock" class="nav-btn flex-1 py-2 flex flex-col items-center text-xs text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-box-archive text-lg mb-0.5"></i>
        <span>เพิ่มสต็อก</span>
      </button>
    </div>
  </nav>

  <script>
    // ฝัง URL ตรงนี้เรียบร้อยแล้ว
    const API_URL = 'https://script.google.com/macros/s/AKfycbzl0wtf4vNv953jgWVX3gbI-tAYx0ONKKrapgnTRcwwRaMftTsor6eUKzmz_q67yUl8eA/exec';
    let currentFetchedProduct = null;

    window.onload = () => {
      loadExpiryItems();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-indigo-400', 'font-semibold');
        btn.classList.add('text-slate-400');
      });

      const activeNav = document.getElementById('nav-' + tabId);
      activeNav.classList.remove('text-slate-400');
      activeNav.classList.add('text-indigo-400', 'font-semibold');

      if (tabId === 'tab-view-exp') loadExpiryItems();
    }

    // Tab 1 Auth
    function verifyPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === '254903') {
        document.getElementById('authOverlay').classList.add('hidden');
        document.getElementById('addStockForm').classList.remove('hidden');
      } else {
        alert('รหัสผ่านไม่ถูกต้อง');
      }
    }

    // Save Stock
    async function saveStock() {
      const barcode = String(document.getElementById('stockBarcode').value).trim();
      const name = document.getElementById('stockName').value.trim();
      const price = document.getElementById('stockPrice').value.trim();

      if (!barcode || !name || !price) return alert('กรุณากรอกข้อมูลให้ครบทุกช่อง');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addStock', barcode, name, price })
        });
        const result = await res.json();
        if (result.success) {
          alert('บันทึกเข้าสต็อกเรียบร้อยแล้ว');
          document.getElementById('stockBarcode').value = '';
          document.getElementById('stockName').value = '';
          document.getElementById('stockPrice').value = '';
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึก: ' + err.message);
      }
    }

    // Fetch Product for Expiry Tab
    async function fetchProductInfo() {
      const barcode = String(document.getElementById('expBarcode').value).trim();
      if (!barcode) return alert('กรุณากรอกรหัสบาร์โค้ด');

      try {
        const res = await fetch(`${API_URL}?action=getProducts`);
        const result = await res.json();
        
        if (result.success) {
          const product = result.data.find(p => String(p.barcode) === barcode);
          if (product) {
            currentFetchedProduct = product;
            document.getElementById('previewName').innerText = product.name;
            document.getElementById('previewPrice').innerText = `ราคา/รายละเอียด: ${product.price}`;
            document.getElementById('productPreview').classList.remove('hidden');
          } else {
            alert('ไม่พบข้อมูลสินค้านี้ในสต็อก (กรุณาเพิ่มสินค้าในระบบสต็อกก่อน)');
            document.getElementById('productPreview').classList.add('hidden');
          }
        }
      } catch (err) {
        alert('ดึงข้อมูลไม่สำเร็จ: ' + err.message);
      }
    }

    // Save Expiry
    async function saveExpiry() {
      const barcode = String(document.getElementById('expBarcode').value).trim();
      const expiryDate = document.getElementById('expDateInput').value;

      if (!barcode || !expiryDate) return alert('กรุณากรอกบาร์โค้ดและเลือกวันหมดอายุ');
      if (!currentFetchedProduct) return alert('กรุณากดปุ่ม "ดึงข้อมูล" ก่อนบันทึก');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'addExpiry',
            barcode: barcode,
            name: currentFetchedProduct.name,
            price: currentFetchedProduct.price,
            expiryDate: expiryDate
          })
        });
        const result = await res.json();
        if (result.success) {
          alert('บันทึกวันหมดอายุเรียบร้อยแล้ว');
          document.getElementById('expBarcode').value = '';
          document.getElementById('expDateInput').value = '';
          document.getElementById('productPreview').classList.add('hidden');
          currentFetchedProduct = null;
        }
      } catch (err) {
        alert('บันทึกไม่สำเร็จ: ' + err.message);
      }
    }

    // Load Expiry List
    async function loadExpiryItems() {
      const container = document.getElementById('expiryList');
      container.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังโหลดรายการ...</div>';

      try {
        const res = await fetch(`${API_URL}?action=getExpiryItems`);
        const result = await res.json();

        if (result.success && result.data.length > 0) {
          container.innerHTML = result.data.map(item => `
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/80 flex justify-between items-center hover:border-slate-600 transition">
              <div class="space-y-1">
                <div class="flex items-center space-x-2">
                  <span class="font-mono text-xs text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">#${item.barcode}</span>
                  <span class="font-bold text-white text-base">${item.name}</span>
                </div>
                <div class="text-xs text-slate-400">
                  <span>ราคา: ${item.price}</span> | <span>หมดอายุ: ${item.expiryDate}</span>
                </div>
              </div>
              <div class="text-right">
                <span class="inline-block px-3 py-1 rounded-full text-xs mb-1 ${item.badgeClass}">${item.status}</span>
                <div class="text-xs font-semibold ${item.daysLeft <= 15 ? 'text-rose-400' : 'text-slate-300'}">
                  ${item.daysLeft <= 0 ? 'หมดอายุแล้ว' : `เหลืออีก ${item.daysLeft} วัน`}
                </div>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div class="text-center py-8 text-slate-500">ไม่มีรายการสินค้า RTC ในขณะนี้</div>';
        }
      } catch (err) {
        container.innerHTML = '<div class="text-center py-8 text-rose-400">เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
      }
    }
  </script>
</body>
</html>
